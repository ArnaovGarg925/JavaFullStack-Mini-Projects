<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Employee Management System</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="brand-icon">EMS</div>
            <h1>Employee Management</h1>
            <p>Spring Security &amp; JWT Protected Portal</p>
        </div>

        <!-- Alert messages -->
        <div th:if="${errorMessage}" class="alert alert-error">
            <span>⚠️</span>
            <span th:text="${errorMessage}">Invalid credentials</span>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-success">
            <span>✓</span>
            <span th:text="${logoutMessage}">Logged out successfully</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group" style="margin-bottom: 1.1rem;">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin or user" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
                Sign In to Dashboard
            </button>
        </form>

        <div class="demo-credentials-box">
            <p style="margin-bottom: 0.35rem;"><strong>Demo Credentials (In-Memory Security):</strong></p>
            <p>• Administrator: <code>admin</code> / <code>admin123</code></p>
            <p>• Regular User: <code>user</code> / <code>user123</code></p>
            <p>• Manager: <code>manager</code> / <code>manager123</code></p>
        </div>
    </div>
</body>
</html>
